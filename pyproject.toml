# Deployment settings for Vercel. Local development uses requirements.txt and `npm run dev`.
# No [build-system] table: this is not an installable package, so installers only add the dependencies.

[project]
name = "radium"
version = "1.0.0"
description = "Planetary site suitability and Earth analog discovery (NASA Space Apps Challenge)"
license = "Apache-2.0"
requires-python = ">=3.9"
# Same list as requirements.txt (runtime only; the data pipeline's packages are in requirements-pipeline.txt).
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn[standard]>=0.39.0",
    "pydantic>=2.13.5",
    "starlette>=0.49.3",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "shapely>=2.0.7",
    "pillow>=11.3.0",
]

[tool.vercel]
# The FastAPI app lives in backend/app.py, which is not one of Vercel's default entrypoint paths.
entrypoint = "backend.app:app"

[tool.vercel.scripts]
# Build the web app, then place it in public/ so Vercel's CDN serves it at "/" without the Python function.
# Puppeteer is only used for local screenshots, so its browser download is skipped.
build = "PUPPETEER_SKIP_DOWNLOAD=1 npm ci && npm run build && cp -R dist/. public/"
